name: CI & CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  Build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Copy compose file to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_SSH_KEY }}
        source: "Lampshade/compose.prod.yml"
        target: "/root/AmirSite"
        strip_components: 1
    
    - name: Login to Docker Hub
    
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./Lampshade
        file: ./Lampshade/ServiceHost/Dockerfile
        push: true
        tags: |
          amirhkz84/servicehost:1.${{ github.run_number }}
          amirhkz84/servicehost:latest
  deply:
    needs: Build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Deploy on Server with SSH
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /root/AmirSite
          docker compose -f compose.prod.yml pull
          docker compose -f compose.prod.yml up -d
